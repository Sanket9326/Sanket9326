  <rect x="1" y="1" width="1198" height="328" rx="24" fill="url(#bg)" stroke="#334155" stroke-opacity="0.55" stroke-width="2" />
  <rect x="30" y="28" width="1140" height="2" rx="1" fill="url(#line)" />
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
