<svg xmlns="http://www.w3.org/2000/svg" width="960" height="358" viewBox="0 0 960 358" role="img" aria-labelledby="title desc">
<title id="title">The engineering stack</title><desc id="desc">Backend: C# / .NET / ASP.NET Core, EF Core · Java. Frontend: Angular / TypeScript, RxJS · SignalR. Messaging: Kafka / Redis, Azure Service Bus. Data: PostgreSQL / SQL Server, Qdrant · MinIO. Cloud &amp; delivery: Azure / Docker / Kubernetes, Helm · Argo CD. Observability: OpenTelemetry, Prometheus · Grafana</desc>
