<svg width="1200" height="330" viewBox="0 0 1200 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sanket's core technology toolbox</title>
  <desc id="desc">Backend, distributed systems, cloud and delivery, data and interface technologies.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F" />
      <stop offset="1" stop-color="#11112A" />
    </linearGradient>
    <linearGradient id="line" x1="30" y1="0" x2="1170" y2="0" gradientUnits="userSpaceOnUse">
