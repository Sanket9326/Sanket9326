      <circle cx="33" cy="7" r="7" fill="#FFBD2E"/>
      <circle cx="59" cy="7" r="7" fill="#27C93F"/>
      <text x="85" y="12" fill="#64748B" font-size="13">sanket@github: ~/profile</text>
    </g>

    <g transform="translate(58 100)">
      <text y="18" fill="#2DD4BF" font-size="15">$ whoami</text>
      <text y="90" fill="#F8FAFC" font-size="48" font-weight="800" letter-spacing="-1.8">SANKET SAWANT</text>
      <text y="132" fill="#BAE6FD" font-size="21" font-weight="650">Software Engineer · Distributed Systems</text>
      <text y="177" fill="#94A3B8" font-size="15">Building reliable backends for real traffic</text>
      <text y="202" fill="#94A3B8" font-size="15">and real failure modes.</text>

      <g transform="translate(0 247)" font-size="12" font-weight="700">
        <g><rect width="102" height="34" rx="7" fill="#2DD4BF" fill-opacity="0.08" stroke="#2DD4BF" stroke-opacity="0.4"/><text x="51" y="22" text-anchor="middle" fill="#99F6E4">C# / .NET</text></g>
        <g transform="translate(115)"><rect width="84" height="34" rx="7" fill="#38BDF8" fill-opacity="0.08" stroke="#38BDF8" stroke-opacity="0.4"/><text x="42" y="22" text-anchor="middle" fill="#BAE6FD">KAFKA</text></g>
        <g transform="translate(212)"><rect width="84" height="34" rx="7" fill="#818CF8" fill-opacity="0.08" stroke="#818CF8" stroke-opacity="0.4"/><text x="42" y="22" text-anchor="middle" fill="#C7D2FE">AZURE</text></g>
        <g transform="translate(309)"><rect width="118" height="34" rx="7" fill="#F472B6" fill-opacity="0.07" stroke="#F472B6" stroke-opacity="0.34"/><text x="59" y="22" text-anchor="middle" fill="#FBCFE8">KUBERNETES</text></g>
      </g>
    </g>

    <g transform="translate(698 76)">
      <rect width="442" height="300" rx="16" fill="#030712" fill-opacity="0.74" stroke="#475569" stroke-opacity="0.48"/>
      <path d="M0 46H442" stroke="#334155" stroke-opacity="0.72"/>
      <text x="22" y="29" fill="#64748B" font-size="12">engineer.config.ts</text>

      <g font-size="13.5">
        <text x="20" y="77" fill="#475569">01</text><text x="52" y="77" fill="#C084FC">const</text><text x="101" y="77" fill="#E2E8F0"> engineer </text><text x="179" y="77" fill="#94A3B8">=</text><text x="194" y="77" fill="#E2E8F0"> {</text>
        <text x="20" y="106" fill="#475569">02</text><text x="72" y="106" fill="#7DD3FC">role</text><text x="112" y="106" fill="#94A3B8">:</text><text x="126" y="106" fill="#86EFAC">'SDE-2 @ Xperate'</text><text x="272" y="106" fill="#94A3B8">,</text>
        <text x="20" y="135" fill="#475569">03</text><text x="72" y="135" fill="#7DD3FC">focus</text><text x="120" y="135" fill="#94A3B8">:</text><text x="134" y="135" fill="#E2E8F0"> [</text>
        <text x="20" y="164" fill="#475569">04</text><text x="94" y="164" fill="#86EFAC">'distributed systems'</text><text x="263" y="164" fill="#94A3B8">,</text>
        <text x="20" y="193" fill="#475569">05</text><text x="94" y="193" fill="#86EFAC">'event-driven design'</text><text x="271" y="193" fill="#94A3B8">,</text>
        <text x="20" y="222" fill="#475569">06</text><text x="94" y="222" fill="#86EFAC">'reliability'</text>
        <text x="20" y="251" fill="#475569">07</text><text x="72" y="251" fill="#E2E8F0">],</text>
        <text x="20" y="280" fill="#475569">08</text><text x="52" y="280" fill="#E2E8F0">};</text><rect x="78" y="266" width="8" height="17" fill="#2DD4BF" fill-opacity="0.8"/>
