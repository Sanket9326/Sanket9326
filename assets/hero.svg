<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sanket Sawant — Software Engineer</title>
  <desc id="desc">A terminal-inspired banner for a software engineer specializing in distributed systems.</desc>
  <defs>
    <linearGradient id="panel" x1="32" y1="14" x2="1165" y2="418" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="0.58" stop-color="#111827"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1200" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF" stop-opacity="0.82"/>
      <stop offset="0.5" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0.72"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(905 214) rotate(90) scale(260 360)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0EA5E9" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#94A3B8" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="1198" height="428" rx="24" fill="url(#panel)"/>
  <rect x="1" y="1" width="1198" height="428" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="428" rx="24" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="428" rx="24" stroke="url(#edge)" stroke-width="2"/>

  <g font-family="Cascadia Code, SFMono-Regular, Consolas, Liberation Mono, monospace">
