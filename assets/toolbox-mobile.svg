<svg xmlns="http://www.w3.org/2000/svg" width="440" height="754" viewBox="0 0 440 754" role="img" aria-labelledby="title desc">
<title id="title">The engineering stack</title><desc id="desc">Backend: C# / .NET / ASP.NET Core, EF Core · Java. Frontend: Angular / TypeScript, RxJS · SignalR. Messaging: Kafka / Redis, Azure Service Bus. Data: PostgreSQL / SQL Server, Qdrant · MinIO. Cloud &amp; delivery: Azure / Docker / Kubernetes, Helm · Argo CD. Observability: OpenTelemetry, Prometheus · Grafana</desc>
<style>svg{font-family:Arial,Helvetica,sans-serif} .packet{animation:flow 6s linear infinite}.orbit{animation:orbit 36s linear infinite;transform-box:fill-box;transform-origin:center}.cursor{animation:blink 2s steps(2,end) infinite}@keyframes flow{to{stroke-dashoffset:-120}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){.packet,.orbit,.cursor{animation:none}}</style>
